<!-- Cross-zone policy / routing legend box -->
<rect x="40" y="940" width="680" height="222" rx="10" fill="none" stroke="rgb(194,192,182)" stroke-width="0.5"/>
<text x="56" y="962" class="l" fill="rgb(211,209,199)" font-size="13" font-weight="500">Cross-zone relationships</text>
<text x="56" y="982" class="l" fill="rgb(156,154,146)" font-size="11">Team: zones openly routed.  Pro: same topology + stricter policy (allowed paths only).</text>

<text x="56" y="1012" class="l" fill="rgb(245,196,179)" font-size="11">— operator (ent-attack) → all zones (assessment surface)</text>
<text x="56" y="1034" class="l" fill="rgb(175,169,236)" font-size="11">— identity / secrets / DNS (ent-idp-01) → all zones (shared infrastructure)</text>
<text x="56" y="1056" class="l" fill="rgb(151,196,89)" font-size="11">— app (ent-app-01) → inference (ent-inference-01) — approved RAG → LLM path</text>
<text x="56" y="1078" class="l" fill="rgb(93,202,165)" font-size="11">— inference / mlops platform → data (ent-data-01) — approved platform → data path</text>
<text x="56" y="1100" class="l" fill="rgb(175,169,236)" font-size="11">— all zones → observability (ent-observe-01) — log/event ingestion</text>
<text x="56" y="1126" class="l" fill="rgb(156,154,146)" font-size="11">Source of truth: lab-scripts/lib/enterprise-inventory.sh · Terraform/AWS mirror is a later, separate path.</text>
<text x="56" y="1146" class="l" fill="rgb(156,154,146)" font-size="11">Mini lab (6-VM, 172.16.50.0/24) remains the supported baseline and is unchanged.</text>
