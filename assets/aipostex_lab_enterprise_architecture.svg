<!-- Title -->
<text x="380" y="34" class="cm" fill="rgb(250,249,245)" font-size="16" font-weight="500">aipostex-lab — Enterprise line (in development)</text>
<text x="380" y="54" class="cm" fill="rgb(194,192,182)" font-size="12">Routed multi-zone Proxmox range · acme.internal · native systemd services · no Docker</text>
<text x="380" y="72" class="cm" fill="rgb(156,154,146)" font-size="11">Team 36 GiB / 16 vCPU · Pro 44 GiB / 20 vCPU (same topology; Pro adds stricter cross-zone policy + deeper telemetry)</text>

