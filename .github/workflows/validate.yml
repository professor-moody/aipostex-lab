name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python validation dependencies
        run: python -m pip install pytest mkdocs-material

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run local validation suite
        env:
          REQUIRE_SHELLCHECK: "1"
        run: bash lab-scripts/test-local.sh
