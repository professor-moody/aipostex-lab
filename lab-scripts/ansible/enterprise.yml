---
# aipostex Enterprise Lab — staged Ansible orchestration
#
# This playbook is intentionally a thin wrapper over the enterprise Bash role
# scripts. Proxmox infrastructure, snapshots, reset, and Pro firewall policy
# stay in Bash.

- name: Enterprise base setup
  hosts: enterprise
  become: true
  tags: [base]
  tasks:
    - name: Copy enterprise base setup
      copy:
        src: "{{ repo_root }}/lab-scripts/base-setup.sh"
        dest: "{{ lab_root }}/base-setup.sh"
        mode: "0755"

    - name: Copy enterprise inventory library
      copy:
        src: "{{ repo_root }}/lab-scripts/lib/"
        dest: "{{ lab_root }}/lib/"
        mode: preserve

    - name: Run enterprise base setup
      command: "env LAB_INVENTORY_PATH={{ lab_root }}/lib/enterprise-inventory.sh bash {{ lab_root }}/base-setup.sh"

- name: Enterprise provision attack box
  hosts: enterprise_attack
  become: true
  tags: [provision]
  tasks:
    - name: Copy lab scripts to attack box
      copy:
        src: "{{ repo_root }}/lab-scripts/"
        dest: "{{ lab_root }}/"
        mode: preserve

    - name: Run attack-box enterprise provisioner
      command: "bash {{ lab_root }}/{{ lab_role_dir }}/provision.sh"

    - name: Read attack-box public key
      slurp:
        src: "/home/{{ ansible_user }}/.ssh/id_ed25519.pub"
      register: enterprise_attack_pubkey

- name: Enterprise distribute attack-box SSH key
  hosts: enterprise_targets
  tags: [provision]
  tasks:
    - name: Ensure SSH directory exists
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Trust attack-box key for target access
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
        line: "{{ hostvars['ent-attack'].enterprise_attack_pubkey.content | b64decode | trim }}"
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

