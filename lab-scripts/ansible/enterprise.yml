      command: "{{ repo_root }}/lab-scripts/enterprise-verify.sh --layer all --profile {{ enterprise_profile }}"
      register: enterprise_verify
      changed_when: false

    - name: Show enterprise verification output
      debug:
        var: enterprise_verify.stdout_lines
