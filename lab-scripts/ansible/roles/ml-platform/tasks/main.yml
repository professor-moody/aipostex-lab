---
# ML Platform role: deploy all services on ailab-ml
# Combines native services (ChromaDB, MLflow, LiteLLM, Ray) and mock services

- name: Create mluser account
  user:
    name: "{{ ml_user }}"
    shell: /bin/bash
    create_home: true

- name: Create ML runtime venv
  pip:
    name:
      - chromadb
      - mlflow==2.21.3
      - litellm[proxy]==1.60.7
      - boto3==1.34.162
      - botocore==1.34.162
      - ray[default]==2.54.1
    virtualenv: "{{ ml_venv_path }}"
    virtualenv_command: python3 -m venv

- name: Copy ML platform scripts
  copy:
    src: "{{ repo_root }}/lab-scripts/ml-platform/"
    dest: "{{ lab_root }}/ml-platform/"
    mode: preserve

- name: Copy shared libraries
  copy:
    src: "{{ repo_root }}/lab-scripts/lib/"
    dest: "{{ lab_root }}/lib/"
    mode: preserve

# ── Deploy mock services via loop ────────────────────────
- name: Create mock service directories
  file:
    path: "/home/{{ ml_user }}/projects/{{ item.src }}"
    state: directory
    owner: "{{ ml_user }}"
    group: "{{ ml_user }}"
  loop: "{{ ml_mock_services }}"

- name: Copy mock server.py files
  copy:
    src: "{{ repo_root }}/lab-scripts/ml-platform/{{ item.src }}/server.py"
    dest: "/home/{{ ml_user }}/projects/{{ item.src }}/server.py"
    owner: "{{ ml_user }}"
    group: "{{ ml_user }}"
    mode: '0644'
  loop: "{{ ml_mock_services }}"
  notify: "restart mock services"

- name: Deploy mock systemd units
  template:
    src: mock-service.service.j2
    dest: "/etc/systemd/system/{{ item.unit }}.service"
  loop: "{{ ml_mock_services }}"
  notify: "restart mock services"

- name: Enable and start mock services
  systemd:
    name: "{{ item.unit }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ ml_mock_services }}"

- name: Wait for mock services to be healthy
  uri:
    url: "http://localhost:{{ item.port }}{{ item.health }}"
    method: GET
    status_code: [200, 404]
    timeout: 5
  register: health_result
  until: health_result.status in [200, 404]
  retries: 20
  delay: 2
  loop: "{{ ml_mock_services }}"

# ── Run provision.sh for native services (ChromaDB, MLflow, LiteLLM, Ray) ──
# These have complex setup that's better handled by the existing bash script.
# The mock services above are handled idempotently by Ansible.
- name: Run native service provisioner
  command: "sudo bash {{ lab_root }}/ml-platform/provision.sh"
  args:
    creates: /etc/systemd/system/chromadb.service
